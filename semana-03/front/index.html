<!DOCTYPE html>
<html lang="es">

<head>
    <!-- To change the distributions depending the device -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Add a title in the browser page -->
    <title>Task Manager</title>
    <!-- Add a connection between this html file and css one -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Title, logo, navigation -->
    <header>
        <h1>Task Manager</h1>
        <nav>
            <!-- Let me navigate to the selected part of the page with one click -->
            <ul>
                <li><a href="#add-user">Users</a></li>
                <li><a href="#add-task">Add Task</a></li>
                <li><a href="#check-task">Check Tasks</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- SECTION 1: CREATE USER -->
        <section id="add-user">
            <h2>Add New User</h2>
            <form>
                <label for="user-name">Name:</label>
                <input type="text" id="user-name" placeholder="Ej. Aitor" required>

                <label for="user-email">Email:</label>
                <input type="email" id="user-email" placeholder="Ej. aitor@example.com" required>

                <button type="submit" class="block">Create User</button>
            </form>
        </section>

        <!-- SECTION 2: CREATE TASK FOR USER -->
        <section id="add-task">
            <h2>Add Task to User</h2>
            <form>
                <label for="task-user-select">Assign to User:</label>
                <select id="task-user-select" required>
                    <option value="" disabled selected>Select a user...</option>
                    <option value="1">Aitor (aitor@example.com)</option>
                    <option value="2">Maria (maria@example.com)</option>
                </select>

                <label for="task-text">Task description:</label>
                <input type="text" id="task-text" placeholder="Ej. Clean desk" required>

                <button type="submit" class="block">Add Task</button>
            </form>
        </section>

        <!-- SECTION 3: CHECK TASKS GROUPED BY USER -->
        <section id="check-task">
            <h2>User Tasks List</h2>

            <!-- USER CARD 1 -->
            <article class="user-card">
                <div class="user-header">
                    <h3>Aitor</h3>
                    <span class="user-email">aitor@example.com</span>
                </div>
                
                <ul class="task-list">
                    <li class="task-item">
                        <div class="task-info">
                            <input type="checkbox" id="task-1" checked>
                            <label for="task-1" class="task-completed">Clean desk</label>
                        </div>
                        <button type="button" class="btn-delete">Delete</button>
                    </li>
                    <li class="task-item">
                        <div class="task-info">
                            <input type="checkbox" id="task-2">
                            <label for="task-2">Learn Spring Security</label>
                        </div>
                        <button type="button" class="btn-delete">Delete</button>
                    </li>
                </ul>
            </article>

            <!-- USER CARD 2 -->
            <article class="user-card">
                <div class="user-header">
                    <h3>Maria</h3>
                    <span class="user-email">maria@example.com</span>
                </div>
                
                <ul class="task-list">
                    <li class="task-item">
                        <div class="task-info">
                            <input type="checkbox" id="task-3">
                            <label for="task-3">Setup Postman collection</label>
                        </div>
                        <button type="button" class="btn-delete">Delete</button>
                    </li>
                </ul>
            </article>
        </section>
    </main>

    <!-- FOOTER: Copyright -->
    <footer>
        <p>Task Manager. Rights reserved.</p>
    </footer>

</body>
</html>
